name: Generate Project

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: project-generation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: startsWith(github.event.issue.title, '[generate-project] ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Validate public request envelope
        id: request
        shell: bash
        run: |
          python tools/request.py extract \
            --event "$GITHUB_EVENT_PATH" \
            --allowed-owners config/allowed-owners.json

      - name: Resolve accepted Bootstrap release
        id: public-contract
        shell: bash
        env:
          PROJECT_FORGE_BOOTSTRAP_SOURCE_REPOSITORY: ${{ secrets.BOOTSTRAP_SOURCE_OWNER }}/${{ secrets.BOOTSTRAP_SOURCE_REPOSITORY_NAME }}
          PROJECT_FORGE_BOOTSTRAP_SOURCE_COMMIT: ${{ secrets.BOOTSTRAP_SOURCE_COMMIT }}
          PROJECT_FORGE_BOOTSTRAP_RELEASE_ID: ${{ secrets.BOOTSTRAP_RELEASE_ID }}
        run: python tools/project_forge_contract.py resolve-bootstrap

      - name: Create Bootstrap source installation token
        id: source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ secrets.BOOTSTRAP_SOURCE_OWNER }}
          repositories: ${{ secrets.BOOTSTRAP_SOURCE_REPOSITORY_NAME }}
          permission-contents: read

      - name: Create target installation token
        id: target-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.request.outputs.target_owner }}
          repositories: ${{ steps.request.outputs.target_name }}
          permission-contents: write
          permission-workflows: write

      - name: Resolve GitHub App bot identity
        id: app-bot
        shell: bash
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          APP_SLUG: ${{ steps.target-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if [ -z "$APP_SLUG" ]; then
            echo "GitHub App token action did not return app-slug" >&2
            exit 2
          fi
          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_login}" --jq '.id')"
          if ! [[ "$bot_id" =~ ^[0-9]+$ ]]; then
            echo "Unable to resolve GitHub App bot user id for ${bot_login}" >&2
            exit 2
          fi
          echo "login=${bot_login}" >> "$GITHUB_OUTPUT"
          echo "email=${bot_id}+${bot_login}@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Checkout accepted Bootstrap source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.BOOTSTRAP_SOURCE_OWNER }}/${{ secrets.BOOTSTRAP_SOURCE_REPOSITORY_NAME }}
          ref: ${{ secrets.BOOTSTRAP_SOURCE_COMMIT }}
          token: ${{ steps.source-token.outputs.token }}
          path: bootstrap
          fetch-depth: 1

      - name: Verify accepted Bootstrap source and catalog
        id: bootstrap
        shell: bash
        env:
          BOOTSTRAP_COMMIT: ${{ secrets.BOOTSTRAP_SOURCE_COMMIT }}
          BOOTSTRAP_PROTOCOL_VERSION: ${{ steps.public-contract.outputs.bootstrap_protocol_version }}
          BOOTSTRAP_CATALOG_VERSION: ${{ steps.public-contract.outputs.bootstrap_catalog_version }}
        run: |
          set -euo pipefail
          sha="$(git -C bootstrap rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          if [ "$sha" != "$BOOTSTRAP_COMMIT" ]; then
            echo "Accepted Bootstrap checkout does not match protected source configuration" >&2
            exit 2
          fi
          python tools/project_forge_contract.py verify-bootstrap \
            --root bootstrap \
            --protocol-version "$BOOTSTRAP_PROTOCOL_VERSION" \
            --catalog-version "$BOOTSTRAP_CATALOG_VERSION"

      - name: Checkout private target seed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.request.outputs.target_repository }}
          token: ${{ steps.target-token.outputs.token }}
          path: target
          fetch-depth: 0

      - name: Verify target is safe for first publication
        shell: bash
        run: |
          python bootstrap/tools/remote_generation.py preflight-target \
            --root target \
            --repository "${{ steps.request.outputs.target_repository }}"

      - name: Validate private approved manifest
        id: manifest
        shell: bash
        run: |
          python bootstrap/tools/remote_generation.py validate-manifest \
            --manifest target/PROJECT_BOOTSTRAP.json \
            --request-author "${{ steps.request.outputs.request_author }}" \
            --expected-bootstrap-commit "${{ steps.bootstrap.outputs.sha }}" \
            --expected-target-repository "${{ steps.request.outputs.target_repository }}" \
            --expected-target-owner "${{ steps.request.outputs.target_owner }}" \
            --allowed-target-owner "${{ steps.request.outputs.target_owner }}"

      - name: Acquire exact Project Forge package artifact
        id: project-forge-package
        shell: bash
        env:
          PROJECT_FORGE_PACKAGE: ${{ steps.manifest.outputs.project_forge_package }}
          PROJECT_FORGE_VERSION: ${{ steps.manifest.outputs.project_forge_version }}
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/project-forge-package"
          pack_json="$RUNNER_TEMP/project-forge-pack.json"
          mkdir -p "$package_dir"

          npm pack "${PROJECT_FORGE_PACKAGE}@${PROJECT_FORGE_VERSION}" \
            --json \
            --ignore-scripts \
            --pack-destination "$package_dir" > "$pack_json"

          filename="$(node -e '
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(result) || result.length !== 1 || !result[0].filename) process.exit(2);
            process.stdout.write(result[0].filename);
          ' "$pack_json")"
          tarball="$package_dir/$filename"
          if [ ! -f "$tarball" ]; then
            echo "npm pack did not produce expected Project Forge tarball: $tarball" >&2
            exit 2
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify approved Project Forge package integrity
        shell: bash
        env:
          PROJECT_FORGE_TARBALL: ${{ steps.project-forge-package.outputs.tarball }}
          PROJECT_FORGE_INTEGRITY: ${{ steps.manifest.outputs.project_forge_integrity }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('bootstrap/tools').resolve()))
          import project_forge_package_generation

          project_forge_package_generation.verify_integrity(
              Path(os.environ['PROJECT_FORGE_TARBALL']),
              os.environ['PROJECT_FORGE_INTEGRITY'],
          )
          print('Project Forge package integrity verified')
          PY

      - name: Generate deterministic workspace
        shell: bash
        run: |
          set -euo pipefail
          python bootstrap/tools/generate_snapshot.py \
            --manifest target/PROJECT_BOOTSTRAP.json \
            --output "$RUNNER_TEMP/generated" \
            --project-forge-tarball "${{ steps.project-forge-package.outputs.tarball }}"

      - name: Validate generated workspace
        shell: bash
        env:
          PROJECT_FORGE_PACKAGE: ${{ steps.manifest.outputs.project_forge_package }}
          PROJECT_FORGE_VERSION: ${{ steps.manifest.outputs.project_forge_version }}
          PROJECT_FORGE_PROFILE: ${{ steps.manifest.outputs.project_forge_profile }}
          PROJECT_FORGE_INTEGRITY: ${{ steps.manifest.outputs.project_forge_integrity }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/project-forge-pycache
        run: |
          set -euo pipefail
          python -m compileall -q "$RUNNER_TEMP/generated/tools"
          python "$RUNNER_TEMP/generated/tools/project-forge-package/check-managed-baselines.py"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'generated'
          required = [
              'PROJECT_BOOTSTRAP.json',
              'PROJECT_FORGE_BASELINE.json',
              'CORE_BASELINE.json',
              'DEPLOYMENT_BASELINE.json',
              'DEV_ENVIRONMENT.json',
              'SCAFFOLD_PLAN.json',
          ]
          documents = {}
          for name in required:
              documents[name] = json.loads((root / name).read_text(encoding='utf-8'))
              print('OK', name)

          manifest = documents['PROJECT_BOOTSTRAP.json']
          approved = manifest['generation']['project-forge']
          expected = {
              'package': os.environ['PROJECT_FORGE_PACKAGE'],
              'version': os.environ['PROJECT_FORGE_VERSION'],
              'profile': os.environ['PROJECT_FORGE_PROFILE'],
              'integrity': os.environ['PROJECT_FORGE_INTEGRITY'],
          }
          if approved != expected:
              raise SystemExit(f'Generated manifest Project Forge provenance mismatch: expected {expected!r}, found {approved!r}')

          project_forge = documents['PROJECT_FORGE_BASELINE.json']
          for key in ('package', 'version', 'profile'):
              if project_forge.get(key) != expected[key]:
                  raise SystemExit(
                      f'PROJECT_FORGE_BASELINE.json {key} mismatch: expected {expected[key]!r}, found {project_forge.get(key)!r}'
                  )
          components = project_forge.get('components') or {}
          if set(components) != {'core', 'deployment'}:
              raise SystemExit(
                  f'Project Forge baseline must contain core and deployment components; found {sorted(components)}'
              )
          PY
          python tools/check_baseline_handoff.py generated --generated "$RUNNER_TEMP/generated"

          if find "$RUNNER_TEMP/generated" -type f -name '*.pyc' -print -quit | grep -q .; then
            echo "Generated workspace contains Python bytecode; validation caches must stay outside publication." >&2
            find "$RUNNER_TEMP/generated" -type f -name '*.pyc' -print >&2
            exit 2
          fi
          if find "$RUNNER_TEMP/generated" -type d -name '__pycache__' -print -quit | grep -q .; then
            echo "Generated workspace contains __pycache__; validation caches must stay outside publication." >&2
            find "$RUNNER_TEMP/generated" -type d -name '__pycache__' -print >&2
            exit 2
          fi

      - name: Publish generated baseline
        id: publish
        shell: bash
        env:
          PROJECT_SLUG: ${{ steps.manifest.outputs.project_slug }}
          BOT_LOGIN: ${{ steps.app-bot.outputs.login }}
          BOT_EMAIL: ${{ steps.app-bot.outputs.email }}
        run: |
          set -euo pipefail
          target="$GITHUB_WORKSPACE/target"
          generated="$RUNNER_TEMP/generated"

          target_branch="$(git -C "$target" branch --show-current)"
          if [ -z "$target_branch" ]; then
            echo "Unable to resolve target default branch." >&2
            exit 2
          fi

          find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$generated"/. "$target"/
          python tools/check_baseline_handoff.py copied --generated "$generated" --target "$target"

          git -C "$target" config user.name "$BOT_LOGIN"
          git -C "$target" config user.email "$BOT_EMAIL"
          git -C "$target" add -A
          python tools/check_baseline_handoff.py staged --generated "$generated" --target "$target"
          python tools/check_staged_diff.py --root "$target"
          python tools/check_staged_baselines.py --root "$target"

          if git -C "$target" diff --cached --quiet; then
            echo "Generated publication produced no changes." >&2
            exit 2
          fi

          git -C "$target" commit -m "Generate ${PROJECT_SLUG} workspace baseline"
          git -C "$target" push origin "HEAD:${target_branch}"
          echo "commit=$(git -C "$target" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$target_branch" >> "$GITHUB_OUTPUT"

      - name: Report successful generation
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_REPOSITORY: ${{ steps.request.outputs.target_repository }}
          TARGET_COMMIT: ${{ steps.publish.outputs.commit }}
          TARGET_BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Generation published to \`$TARGET_REPOSITORY\` on \`$TARGET_BRANCH\` at \`$TARGET_COMMIT\`. Verify target default-branch CI before local clone/setup acceptance."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report failed generation
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Remote Project generation failed. No publication success is implied. Inspect this workflow run before retrying or modifying the target repository."
