name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Compile Python
        run: python -m compileall -q tools tests
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('.').rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print('OK', path)
          PY
      - name: Validate developer authorization configuration
        run: |
          python tools/invitation.py validate-config \
            --registry config/developers.json \
            --allowed-owners config/allowed-owners.json \
            --policy config/invitation-policy.json
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  required:
    name: required
    if: ${{ always() }}
    needs:
      - validate
    runs-on: ubuntu-latest
    steps:
      - name: Require Control Plane CI
        shell: bash
        run: test "${{ needs.validate.result }}" = "success"
