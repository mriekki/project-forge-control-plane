name: Sync Core

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: core-sync-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: startsWith(github.event.issue.title, '[sync-core] ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Validate public request envelope
        id: request
        shell: bash
        run: |
          python tools/request.py extract \
            --request-type sync-core \
            --event "$GITHUB_EVENT_PATH" \
            --allowed-owners config/allowed-owners.json

      - name: Resolve protected Core source identity
        id: core-source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.CORE_SOURCE_REPOSITORY }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_REPOSITORY" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]]; then
            echo "Protected Core source repository is missing or invalid" >&2
            exit 2
          fi
          owner="${SOURCE_REPOSITORY%%/*}"
          name="${SOURCE_REPOSITORY#*/}"
          echo "::add-mask::$SOURCE_REPOSITORY"
          echo "::add-mask::$name"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create Core source installation token
        id: source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.core-source.outputs.owner }}
          repositories: ${{ steps.core-source.outputs.name }}
          permission-contents: read

      - name: Create target installation token
        id: target-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.request.outputs.target_owner }}
          repositories: ${{ steps.request.outputs.target_name }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-checks: read

      - name: Checkout accepted Project Forge Core source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.CORE_SOURCE_REPOSITORY }}
          token: ${{ steps.source-token.outputs.token }}
          path: core
          fetch-depth: 1

      - name: Resolve accepted Core commit
        id: core
        shell: bash
        run: |
          echo "sha=$(git -C core rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('core/COMPATIBILITY.json').read_text(encoding='utf-8'))
          print(f"version={data['projectForgeCoreVersion']}")
          PY

      - name: Checkout private target consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.request.outputs.target_repository }}
          token: ${{ steps.target-token.outputs.token }}
          path: target
          fetch-depth: 0

      - name: Validate target Core consumer
        id: target
        shell: bash
        env:
          EXPECTED_CORE_REPOSITORY: ${{ secrets.CORE_SOURCE_REPOSITORY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          project_forge_baseline_path = Path('target/PROJECT_FORGE_BASELINE.json')
          if project_forge_baseline_path.is_file():
              raise SystemExit(
                  'Refusing direct Core sync for package-managed Project Forge consumer: '
                  'PROJECT_FORGE_BASELINE.json is present. Use /project-forge-update with an exact published '
                  '@mriekki/project-forge package instead.'
              )

          baseline_path = Path('target/CORE_BASELINE.json')
          if not baseline_path.is_file():
              raise SystemExit('Target is not a Core consumer: CORE_BASELINE.json is missing')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          if baseline.get('schemaVersion') != 1:
              raise SystemExit('Unsupported CORE_BASELINE.json schemaVersion')
          if baseline.get('coreRepository') != os.environ['EXPECTED_CORE_REPOSITORY']:
              raise SystemExit('Target baseline does not match the protected accepted Core source')
          if baseline.get('distribution') != 'greenfield-workspace':
              raise SystemExit('Remote control-plane sync currently supports greenfield-workspace consumers only')
          commit = str(baseline.get('coreCommit') or '')
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Target baseline has an invalid Core commit')
          if not isinstance(baseline.get('managedPaths'), list) or not baseline['managedPaths']:
              raise SystemExit('Target baseline has no managed Core paths')
          if not baseline.get('consumer') or not baseline.get('consumerBaseline'):
              raise SystemExit('Target baseline is missing consumer identity metadata')

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write('distribution=greenfield-workspace\n')
              handle.write(f'previous_core_commit={commit}\n')
          PY

          default_branch="$(git -C target branch --show-current)"
          if [ -z "$default_branch" ]; then
            echo "Unable to resolve target default branch." >&2
            exit 2
          fi
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

      - name: Verify current managed-overlay integrity
        shell: bash
        run: |
          python core/tools/package/check_baseline.py --root target

      - name: Check whether Core is already current
        id: freshness
        shell: bash
        run: |
          set +e
          python core/tools/package/sync.py \
            "${{ steps.target.outputs.distribution }}" \
            --output target \
            --core-commit "${{ steps.core.outputs.sha }}" \
            --check
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview Core sync
        if: steps.freshness.outputs.current != 'true'
        shell: bash
        run: |
          python core/tools/package/sync.py \
            "${{ steps.target.outputs.distribution }}" \
            --output target \
            --core-commit "${{ steps.core.outputs.sha }}"

      - name: Prepare target sync branch
        if: steps.freshness.outputs.current != 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${{ steps.core.outputs.sha }}"
          short_sha="${short_sha:0:12}"
          branch="chore/sync-core-${short_sha}"
          if git -C target ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing remote sync branch: $branch" >&2
            exit 2
          fi
          git -C target switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Apply canonical Core sync
        if: steps.freshness.outputs.current != 'true'
        shell: bash
        run: |
          python core/tools/package/sync.py \
            "${{ steps.target.outputs.distribution }}" \
            --output target \
            --core-commit "${{ steps.core.outputs.sha }}" \
            --apply

      - name: Verify synchronized target
        if: steps.freshness.outputs.current != 'true'
        shell: bash
        run: |
          python core/tools/package/check_baseline.py --root target
          python core/tools/package/sync.py \
            "${{ steps.target.outputs.distribution }}" \
            --output target \
            --core-commit "${{ steps.core.outputs.sha }}" \
            --check
          git -C target diff --check
          git -C target status --short --branch
          git -C target diff --stat
          git -C target diff -- CORE_BASELINE.json

      - name: Commit and push sync branch
        if: steps.freshness.outputs.current != 'true'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git -C target config user.name "project-forge-control-plane[bot]"
          git -C target config user.email "noreply@github.com"
          git -C target add -A
          git -C target diff --cached --check
          if git -C target diff --cached --quiet; then
            echo "Core sync produced no changes after stale check." >&2
            exit 2
          fi
          git -C target commit -m "Sync Project Forge Core to ${{ steps.core.outputs.sha }}"
          git -C target push origin "HEAD:${{ steps.branch.outputs.name }}"
          echo "commit=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create consumer sync PR
        if: steps.freshness.outputs.current != 'true'
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          TARGET_REPOSITORY: ${{ steps.request.outputs.target_repository }}
          BASE_BRANCH: ${{ steps.target.outputs.default_branch }}
          SYNC_BRANCH: ${{ steps.branch.outputs.name }}
          CORE_SHA: ${{ steps.core.outputs.sha }}
          CORE_VERSION: ${{ steps.core.outputs.version }}
          PREVIOUS_CORE_SHA: ${{ steps.target.outputs.previous_core_commit }}
          REQUEST_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/core-sync-pr.md"
          cat > "$body_file" <<EOF
          ## Summary
          - sync the Core-managed greenfield overlay from \`$PREVIOUS_CORE_SHA\` to accepted Core \`$CORE_SHA\` (v$CORE_VERSION)
          - refresh exact managed-path provenance in \`CORE_BASELINE.json\`
          - preserve consumer-owned files and refuse unsafe Core-managed drift
          ## Evidence
          - pre-sync Core baseline integrity passed
          - canonical Core sync preview/apply completed without unsafe states
          - post-sync baseline integrity and strict current-Core check passed
          - created by control-plane request #$REQUEST_NUMBER
          Merge remains an explicit human decision.
          EOF
          pr_url="$(gh pr create \
            --repo "$TARGET_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "Sync Project Forge Core to ${CORE_SHA:0:12}" \
            --body-file "$body_file")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Observe consumer PR CI
        if: steps.freshness.outputs.current != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          TARGET_REPOSITORY: ${{ steps.request.outputs.target_repository }}
        run: |
          set -euo pipefail
          pr_number="${PR_URL##*/}"
          head_sha="$(gh api "/repos/$TARGET_REPOSITORY/pulls/$pr_number" --jq '.head.sha')"
          checks=0
          for _ in $(seq 1 60); do
            checks_json="$(gh api "/repos/$TARGET_REPOSITORY/commits/$head_sha/check-runs?per_page=100")"
            checks="$(jq -r '.total_count' <<<"$checks_json")"
            if [ "$checks" -gt 0 ]; then
              break
            fi
            sleep 2
          done
          if [ "$checks" -eq 0 ]; then
            echo "No consumer PR checks registered within 120 seconds." >&2
            exit 2
          fi

          stable_complete_polls=0
          last_count=-1
          for _ in $(seq 1 360); do
            checks_json="$(gh api "/repos/$TARGET_REPOSITORY/commits/$head_sha/check-runs?per_page=100")"
            checks="$(jq -r '.total_count' <<<"$checks_json")"
            failures="$(jq -r '[.check_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length' <<<"$checks_json")"
            pending="$(jq -r '[.check_runs[] | select(.status != "completed")] | length' <<<"$checks_json")"

            if [ "$failures" -gt 0 ]; then
              jq -r '.check_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")) | "Consumer check failed: \(.name) -> \(.conclusion)"' <<<"$checks_json" >&2
              exit 1
            fi

            if [ "$pending" -eq 0 ]; then
              if [ "$checks" -eq "$last_count" ]; then
                stable_complete_polls=$((stable_complete_polls + 1))
              else
                stable_complete_polls=1
              fi
              if [ "$stable_complete_polls" -ge 3 ]; then
                echo "Consumer PR checks are green and stable ($checks check run(s))."
                exit 0
              fi
            else
              stable_complete_polls=0
            fi

            last_count="$checks"
            sleep 5
          done

          echo "Consumer PR checks did not settle within 30 minutes." >&2
          exit 2

      - name: Report already-current consumer
        if: success() && steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_REPOSITORY: ${{ steps.request.outputs.target_repository }}
          CORE_SHA: ${{ steps.core.outputs.sha }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Core sync not needed: \`$TARGET_REPOSITORY\` already matches accepted Core \`$CORE_SHA\`."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report successful Core sync
        if: success() && steps.freshness.outputs.current != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_REPOSITORY: ${{ steps.request.outputs.target_repository }}
          CORE_SHA: ${{ steps.core.outputs.sha }}
          TARGET_BRANCH: ${{ steps.branch.outputs.name }}
          TARGET_PR: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Core sync PR is ready for human review: \`$TARGET_REPOSITORY\` branch \`$TARGET_BRANCH\` → accepted Core \`$CORE_SHA\`. PR: $TARGET_PR. Consumer PR CI is green; merge is not implied."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report failed Core sync
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Remote Core sync failed or was blocked by safety checks. No target merge or successful synchronization is implied. Inspect this workflow run before retrying."
