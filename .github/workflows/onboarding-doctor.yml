name: Project Forge Onboarding Doctor

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  doctor:
    if: >-
      (github.event_name == 'issues' &&
       startsWith(github.event.issue.title, '[project-forge-doctor] ')) ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '/project-forge-doctor') &&
       (((contains(github.event.issue.body, 'project-forge-onboarding-state:v1') &&
          contains(github.event.issue.body, '"kind":"invite"')) ||
         startsWith(github.event.issue.title, '[invite-project-forge] ')) ||
        startsWith(github.event.issue.title, '[project-forge-doctor] ')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Normalize invitation issue state when needed
        id: normalized-event
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/project-forge-doctor-event.json"
          if grep -q 'project-forge-onboarding-state:v1' "$GITHUB_EVENT_PATH"; then
            python tools/onboarding_issue_state.py normalize-event \
              --kind invite \
              --event "$GITHUB_EVENT_PATH" \
              --output "$output"
          else
            cp "$GITHUB_EVENT_PATH" "$output"
          fi
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Validate doctor request
        id: doctor
        run: |
          python tools/onboarding_portal.py validate \
            --kind doctor \
            --event "${{ steps.normalized-event.outputs.path }}" \
            --registry config/developers.json

      - name: Explain invalid doctor request
        if: steps.doctor.outputs.valid != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          VALIDATION_ERROR: ${{ steps.doctor.outputs.error }}
        with:
          script: |
            const error = process.env.VALIDATION_ERROR || 'Readiness request did not pass validation.';
            const body = [
              '# Project Forge readiness request invalid',
              '',
              `Reason: ${error}`,
              '',
              'For an active Builder, either comment exactly `/project-forge-doctor` on the original invitation issue or open a fresh empty-body issue titled `[project-forge-doctor] <github-user>`.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.setFailed('Invalid Project Forge onboarding doctor request.');

      - name: Resolve Project Forge Builder app identity
        id: app-identity
        if: steps.doctor.outputs.valid == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Verify GitHub App installation
        id: app-token
        if: steps.doctor.outputs.valid == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.doctor.outputs.target_owner }}
          permission-contents: read

      - name: Verify public Project Forge ChatGPT contract
        id: contract
        if: steps.doctor.outputs.valid == 'true'
        continue-on-error: true
        run: |
          python tools/public_contract.py

      - name: Report onboarding readiness
        if: steps.doctor.outputs.valid == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_OWNER: ${{ steps.doctor.outputs.target_owner }}
          ISSUE_NUMBER: ${{ steps.doctor.outputs.issue_number }}
          APP_OK: ${{ steps.app-token.outcome }}
          CONTRACT_OK: ${{ steps.contract.outcome }}
          APP_SLUG: ${{ steps.app-identity.outputs.app-slug }}
        with:
          script: |
            const app = process.env.APP_OK === 'success';
            const contract = process.env.CONTRACT_OK === 'success';
            const ready = app && contract;
            const setup = 'https://github.com/mriekki/project-forge-platform/blob/main/chatgpt/SETUP.md';
            const appUrl = `https://github.com/apps/${process.env.APP_SLUG}/installations/new`;
            const body = [
              '# Project Forge readiness check',
              '',
              '✓ Developer authorization: ACTIVE',
              `${app ? '✓' : '✗'} GitHub App installation: ${app ? 'verified' : 'not verified'}`,
              `${contract ? '✓' : '✗'} Public Project Forge contract: ${contract ? 'verified' : 'unavailable or invalid'}`,
              '',
              ready
                ? 'READY FOR PROJECT FORGE — set up the ChatGPT coding Project once, then start with `New Project: <idea>`.'
                : 'NOT READY — resolve the failed check(s), then add a new comment containing exactly `/project-forge-doctor` to retry.',
              ...(!app ? ['', `Project Forge Builder: ${appUrl}`] : []),
              '',
              `ChatGPT setup: ${setup}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body,
            });
            if (ready) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.ISSUE_NUMBER),
                state: 'closed',
                state_reason: 'completed',
              });
            }
