name: Bootstrap Source Transport Preview (NO GENERATION)

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: bootstrap-source-transport-preview
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PF_BOOTSTRAP_BINDING_PREVIEW_ENABLED == 'true' &&
      github.event.issue.title == '[project-forge-bootstrap-binding-preview]' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact Control Plane event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate exact owner request and protected relocation policy
        id: binding
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PROTECTED_BINDINGS: ${{ secrets.BOOTSTRAP_SOURCE_BINDING_PREVIEW }}
          ORIGINAL_REPOSITORY: ${{ secrets.BOOTSTRAP_SOURCE_REPOSITORY }}
        run: python tools/bootstrap_binding_preview.py resolve --scratch "$RUNNER_TEMP"
      - name: Mint exact original source-only installation token
        id: original-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.binding.outputs.original_owner }}
          repositories: ${{ steps.binding.outputs.original_name }}
          permission-contents: read
      - name: Mint exact candidate source-only installation token
        id: candidate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.binding.outputs.candidate_owner }}
          repositories: ${{ steps.binding.outputs.candidate_name }}
          permission-contents: read
      - name: Observe original source repository through its own token
        shell: bash
        env:
          GH_TOKEN: ${{ steps.original-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ steps.binding.outputs.original_repository }}
        run: |
          set -euo pipefail
          umask 077
          gh api "/repos/$SOURCE_REPOSITORY" --jq '{full_name,id,private,archived}' > "$RUNNER_TEMP/pf-bootstrap-original-repo.json" 2>/dev/null
      - name: Observe candidate source repository through its own token
        shell: bash
        env:
          GH_TOKEN: ${{ steps.candidate-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ steps.binding.outputs.candidate_repository }}
        run: |
          set -euo pipefail
          umask 077
          gh api "/repos/$SOURCE_REPOSITORY" --jq '{full_name,id,private,archived}' > "$RUNNER_TEMP/pf-bootstrap-candidate-repo.json" 2>/dev/null
      - name: Checkout exact original Bootstrap source (read only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.binding.outputs.original_repository }}
          ref: ${{ steps.binding.outputs.original_commit }}
          token: ${{ steps.original-token.outputs.token }}
          path: original-source
          persist-credentials: false
      - name: Checkout exact candidate Bootstrap source (read only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.binding.outputs.candidate_repository }}
          ref: ${{ steps.binding.outputs.candidate_commit }}
          token: ${{ steps.candidate-token.outputs.token }}
          path: candidate-source
          persist-credentials: false
      - name: Independently verify identical Bootstrap source and public contract
        run: python tools/bootstrap_binding_preview.py verify --scratch "$RUNNER_TEMP" --original original-source --candidate candidate-source
      - name: Recheck exact public Control Plane main
        shell: bash
        run: |
          set -euo pipefail
          live="$(git ls-remote https://github.com/$GITHUB_REPOSITORY.git refs/heads/main | cut -f1)"
          test "$live" = "$GITHUB_SHA"
          echo 'BOOTSTRAP_TRANSPORT_PREVIEW_COMPLETE GENERATION_AUTHORIZED=false PRODUCTION_CHANGED=false'
