name: Invite Project Forge Builder

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  invite:
    if: startsWith(github.event.issue.title, '[invite-project-forge] ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Validate invitation
        id: invite
        run: |
          python tools/onboarding_portal.py validate \
            --kind invite \
            --event "$GITHUB_EVENT_PATH" \
            --registry config/developers.json

      - name: Explain invalid invitation request
        if: steps.invite.outputs.valid != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          VALIDATION_ERROR: ${{ steps.invite.outputs.error }}
        with:
          script: |
            const error = process.env.VALIDATION_ERROR || 'Invitation request did not pass validation.';
            const body = [
              '# Project Forge invitation request invalid',
              '',
              `Reason: ${error}`,
              '',
              'No developer authorization was changed.',
              '',
              'Use **Issues → New issue → Invite a Project Forge Builder**, enter the exact GitHub username, keep the issue body empty, and submit a fresh issue.',
              '',
              'The invitation issue is public. Never paste source code, Project requirements, credentials, tokens, or other private information into it.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.setFailed('Invalid Project Forge invitation request; recovery instructions were posted to the issue.');

      - name: Verify invited GitHub user exists
        if: steps.invite.outputs.valid == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_OWNER: ${{ steps.invite.outputs.target_owner }}
        with:
          script: |
            const target = process.env.TARGET_OWNER;
            try {
              const { data } = await github.rest.users.getByUsername({ username: target });
              if (data.type !== 'User') {
                const body = [
                  '# Project Forge invitation needs one fix',
                  '',
                  `\`${target}\` exists on GitHub but is a **${data.type}**, not a user account.`,
                  '',
                  'Project Forge invitations are claimed by the invited GitHub user commenting on this issue, so the target must be a GitHub user account.',
                  '',
                  'Create a fresh **Invite a Project Forge Builder** issue with the developer’s exact GitHub username.',
                  '',
                  'No developer authorization was changed.',
                ].join('\n');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
                core.setFailed(`Project Forge invitation target is not a GitHub user: ${target}`);
              }
            } catch (error) {
              if (error.status === 404) {
                const body = [
                  '# Project Forge invitation needs one fix',
                  '',
                  `GitHub user \`${target}\` was not found.`,
                  '',
                  'Check the spelling and create a fresh **Invite a Project Forge Builder** issue with the exact GitHub username.',
                  '',
                  'No developer authorization was changed.',
                ].join('\n');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
                core.setFailed(`GitHub user not found: ${target}`);
                return;
              }
              throw error;
            }

      - name: Read invitation policy
        id: policy
        if: steps.invite.outputs.valid == 'true'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          policy = json.loads(Path('config/invitation-policy.json').read_text(encoding='utf-8'))
          print(f"expiry_days={policy['expiryDays']}")
          PY

      - name: Resolve Project Forge Builder app identity
        id: app-identity
        if: steps.invite.outputs.valid == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Publish Project Forge onboarding instructions
        if: steps.invite.outputs.valid == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_OWNER: ${{ steps.invite.outputs.target_owner }}
          EXPIRY_DAYS: ${{ steps.policy.outputs.expiry_days }}
          APP_SLUG: ${{ steps.app-identity.outputs.app-slug }}
        with:
          script: |
            const target = process.env.TARGET_OWNER;
            const expiry = process.env.EXPIRY_DAYS;
            const appUrl = `https://github.com/apps/${process.env.APP_SLUG}/installations/new`;
            const welcomeUrl =
              'https://github.com/mriekki/project-forge-platform/blob/main/WELCOME.md';
            const body = [
              '# Welcome to Project Forge',
              '',
              `@${target}, you've been invited as a **Project Builder**.`,
              '',
              '## Activate your access',
              '',
              '**1. Install Project Forge Builder**',
              '',
              `Open the GitHub App and install/approve it for your GitHub account if needed: ${appUrl}`,
              '',
              'For the simplest experience, allow it for all repositories. For tighter access, selected repositories are supported, but each future Project repository must then be added before Project Forge can operate on it.',
              '',
              'If the App is already installed, do not remove or reinstall it just to continue.',
              '',
              '**2. Accept this invitation**',
              '',
              `While signed in as **@${target}**, add a new comment to this issue containing exactly:`,
              '',
              '`/accept-project-forge`',
              '',
              'Project Forge will verify identity, App access, authorization, and the public operating contract automatically.',
              '',
              `Invitation window: **${expiry} days**. To decline instead, comment \`/decline-project-forge\`.`,
              '',
              '**Privacy:** this invitation issue is public. Do not paste source code, Project requirements, credentials, tokens, or other private information here.',
              '',
              `More about Project Forge: ${welcomeUrl}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  test-preview:
    if: startsWith(github.event.issue.title, '[test-invite-forge]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Validate self-test request
        id: test-invite
        continue-on-error: true
        run: |
          python tools/onboarding_test.py extract-invite \
            --event "$GITHUB_EVENT_PATH" \
            --registry config/developers.json

      - name: Explain invalid self-test request
        if: steps.test-invite.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const templateUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new?template=test-onboarding.md`;
            const body = [
              '# Project Forge onboarding test request invalid',
              '',
              'The onboarding self-test request did not pass validation, so no access or authorization was changed.',
              '',
              'For the supported zero-input test:',
              '',
              '- create a fresh **Test Project Forge onboarding** issue from the template;',
              '- leave the prefilled `[test-invite-forge]` title unchanged;',
              '- keep the issue body completely empty;',
              '- submit the issue unchanged while signed in as the active Project Forge admin.',
              '',
              `Create a fresh self-test issue: ${templateUrl}`,
              '',
              'Editing this issue will not rerun the issue-opened workflow; use a new test issue instead.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.setFailed(
              'Invalid Project Forge onboarding self-test request; recovery instructions were posted to the issue.'
            );

      - name: Read invitation policy
        id: test-policy
        if: steps.test-invite.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          policy = json.loads(Path('config/invitation-policy.json').read_text(encoding='utf-8'))
          print(f"expiry_days={policy['expiryDays']}")
          PY

      - name: Resolve Project Forge Builder app identity
        id: test-app-identity
        if: steps.test-invite.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Publish onboarding simulation and invitation message preview
        if: steps.test-invite.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_OWNER: ${{ steps.test-invite.outputs.target_owner }}
          EXPIRY_DAYS: ${{ steps.test-policy.outputs.expiry_days }}
          APP_SLUG: ${{ steps.test-app-identity.outputs.app-slug }}
        with:
          script: |
            const target = process.env.TARGET_OWNER;
            const expiry = process.env.EXPIRY_DAYS;
            const issueUrl = context.payload.issue.html_url;
            const appUrl = `https://github.com/apps/${process.env.APP_SLUG}/installations/new`;
            const welcomeUrl =
              'https://github.com/mriekki/project-forge-platform/blob/main/WELCOME.md';
            const body = [
              '# Project Forge onboarding test',
              '',
              '**TEST MODE — no access or authorization will be granted or changed.**',
              '',
              `This issue lets @${target} rehearse the same short onboarding path a new Project Builder receives.`,
              '',
              '## Invitation message preview',
              '',
              '```text',
              `Hi ${target},`,
              '',
              `You've been invited to Project Forge.`,
              '',
              'Activate your access:',
              `1. Open your invitation issue: ${issueUrl}`,
              `2. Install/approve Project Forge Builder if needed: ${appUrl}`,
              '3. In the invitation issue, add a new comment containing exactly: /accept-project-forge',
              '',
              `More about Project Forge: ${welcomeUrl}`,
              '```',
              '',
              '## Simulate activation',
              '',
              `1. Open **Project Forge Builder**: ${appUrl}`,
              '',
              '   If it is already installed, do not remove or reinstall it for this test.',
              '',
              `2. While signed in as **@${target}**, add a new comment to this issue containing exactly:`,
              '',
              '`/accept-project-forge`',
              '',
              'The test verifies GitHub identity, App availability, and the public Project Forge contract. It does not change authorization, create a Project, deploy, or tear down anything.',
              '',
              `Test window: **${expiry} days**.`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
