name: Claim Project Forge Invitation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: project-forge-developer-registry
  cancel-in-progress: false

jobs:
  claim:
    if: >-
      contains(github.event.issue.body, 'project-forge-onboarding-state:v1') &&
      contains(github.event.issue.body, '"kind":"invite"') &&
      contains(github.event.comment.body, '/accept-project-forge')
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Normalize persisted invitation state
        id: normalized-event
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/project-forge-invitation-event.json"
          python tools/onboarding_issue_state.py normalize-event \
            --kind invite \
            --event "$GITHUB_EVENT_PATH" \
            --output "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Validate claim identity and lifetime
        id: claim
        run: |
          python tools/onboarding_portal.py validate \
            --kind claim \
            --event "${{ steps.normalized-event.outputs.path }}" \
            --registry config/developers.json \
            --policy config/invitation-policy.json

      - name: Explain invalid invitation claim
        if: steps.claim.outputs.valid != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          VALIDATION_ERROR: ${{ steps.claim.outputs.error }}
        with:
          script: |
            const error = process.env.VALIDATION_ERROR || 'Invitation claim did not pass validation.';
            const body = [
              '# Project Forge activation request invalid',
              '',
              `Reason: ${error}`,
              '',
              'No developer authorization was changed by this request.',
              '',
              'Use a new comment containing exactly `/accept-project-forge` while signed in as the GitHub user named in the invitation.',
              '',
              'If the invitation expired or the target is already active, ask the Project Forge admin to create a fresh invitation or use `/project-forge-doctor` for an already-active Builder.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.setFailed('Invalid Project Forge invitation claim; recovery instructions were posted to the issue.');

      - name: Resolve Project Forge Builder app identity
        id: app-identity
        if: steps.claim.outputs.valid == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Verify GitHub App installation
        id: app-token
        if: steps.claim.outputs.valid == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.claim.outputs.target_owner }}
          permission-contents: read

      - name: Explain missing App installation
        if: steps.claim.outputs.valid == 'true' && steps.app-token.outcome != 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          APP_SLUG: ${{ steps.app-identity.outputs.app-slug }}
        with:
          script: |
            const appUrl = `https://github.com/apps/${process.env.APP_SLUG}/installations/new`;
            const body = [
              '# Project Forge activation needs one fix',
              '',
              'Your GitHub identity matched the invitation, but Project Forge could not verify its GitHub App installation for this account.',
              '',
              `Install/approve **Project Forge Builder** here: ${appUrl}`,
              '',
              'Then add a new comment containing exactly `/accept-project-forge` on this issue.',
              '',
              'No developer authorization was activated.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Stop activation when App is unavailable
        if: steps.claim.outputs.valid == 'true' && steps.app-token.outcome != 'success'
        run: |
          echo "Project Forge Builder App installation is not ready for the invited account."
          exit 1

      - name: Create Control Plane registry persistence token
        id: registry-token
        if: steps.claim.outputs.valid == 'true' && steps.app-token.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Re-authenticate Control Plane checkout for registry persistence
        if: steps.claim.outputs.valid == 'true' && steps.app-token.outcome == 'success'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          token: ${{ steps.registry-token.outputs.token }}

      - name: Activate developer
        if: steps.claim.outputs.valid == 'true' && steps.app-token.outcome == 'success'
        run: |
          python tools/invitation.py activate \
            --registry config/developers.json \
            --allowed-owners config/allowed-owners.json \
            --owner "${{ steps.claim.outputs.target_owner }}" \
            --invited-by "${{ steps.claim.outputs.request_author }}" \
            --issue-number "${{ steps.claim.outputs.issue_number }}"
          python tools/invitation.py validate-config \
            --registry config/developers.json \
            --allowed-owners config/allowed-owners.json \
            --policy config/invitation-policy.json

      - name: Commit operational registry update safely
        id: persist
        if: steps.claim.outputs.valid == 'true' && steps.app-token.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_OWNER: ${{ steps.claim.outputs.target_owner }}
        run: |
          set -euo pipefail
          git config user.name "${{ steps.registry-token.outputs.app-slug }}[bot]"
          git config user.email "noreply@github.com"
          git add config/developers.json config/allowed-owners.json
          unexpected="$(git diff --cached --name-only | grep -Ev '^(config/developers\.json|config/allowed-owners\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Refusing unexpected staged registry paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Registry already reflects the activation."
          else
            git commit -m "Activate Project Forge developer ${TARGET_OWNER}"
            git fetch origin main
            git rebase origin/main
            python tools/invitation.py validate-config \
              --registry config/developers.json \
              --allowed-owners config/allowed-owners.json \
              --policy config/invitation-policy.json
            git push origin HEAD:main
          fi

      - name: Explain registry persistence failure
        if: steps.persist.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = [
              '# Project Forge activation needs administrator attention',
              '',
              'Identity and App checks passed, but the Control Plane registry update could not be persisted safely to `main`.',
              '',
              'No force-push or history rewrite was attempted.',
              '',
              'A Project Forge admin should resolve the Control Plane branch conflict or App/ruleset configuration, then ask the invited Builder to comment `/accept-project-forge` again.',
              '',
              'Readiness has not been claimed.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.setFailed('Project Forge registry persistence failed safely.');

      - name: Automatically verify public Project Forge contract
        id: contract
        if: steps.persist.outcome == 'success'
        continue-on-error: true
        run: |
          python tools/public_contract.py

      - name: Report Project Forge activation and readiness
        if: steps.persist.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_OWNER: ${{ steps.claim.outputs.target_owner }}
          CONTRACT_OK: ${{ steps.contract.outcome }}
        with:
          script: |
            const target = process.env.TARGET_OWNER;
            const contract = process.env.CONTRACT_OK === 'success';
            const welcome = 'https://github.com/mriekki/project-forge-platform/blob/main/WELCOME.md';
            const setup = 'https://github.com/mriekki/project-forge-platform/blob/main/chatgpt/SETUP.md';
            const body = contract ? [
              '# Project Forge is ready ✓',
              '',
              `@${target} is now an active **Project Builder**.`,
              '',
              '✓ GitHub identity: VERIFIED',
              '✓ Project Forge access: ACTIVE',
              '✓ Project Forge Builder GitHub App installation: READY',
              '✓ Public platform contract: VERIFIED',
              '',
              '**Next:** set up your Project Forge ChatGPT coding Project once:',
              setup,
              '',
              'After that, start with:',
              '',
              '`New Project: <your idea>`',
              '',
              `Project Forge overview: ${welcome}`,
              '',
              'Your repositories remain yours. Activation grants future Project Forge Control Plane authorization only.',
            ] : [
              '# Project Forge access activated — readiness check needs attention',
              '',
              `@${target} is now an active **Project Builder** and the Project Forge Builder GitHub App installation is verified.`,
              '',
              'The public Project Forge contract could not be verified automatically.',
              '',
              'Authorization remains ACTIVE. Resolve the public-contract availability/integrity issue, then comment `/project-forge-doctor` on this issue to retry readiness.',
              '',
              `Project Forge overview: ${welcome}`,
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.join('\n'),
            });
            if (contract) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

  test-claim:
    if: >-
      contains(github.event.issue.body, 'project-forge-onboarding-state:v1') &&
      contains(github.event.issue.body, '"kind":"test-invite"') &&
      contains(github.event.comment.body, '/accept-project-forge')
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Normalize persisted self-test state
        id: normalized-test-event
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/project-forge-test-invitation-event.json"
          python tools/onboarding_issue_state.py normalize-event \
            --kind test-invite \
            --event "$GITHUB_EVENT_PATH" \
            --output "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Validate self-test identity and lifetime
        id: test-claim
        continue-on-error: true
        run: |
          python tools/onboarding_test.py extract-claim \
            --event "${{ steps.normalized-test-event.outputs.path }}" \
            --registry config/developers.json \
            --policy config/invitation-policy.json

      - name: Explain invalid self-test acceptance
        if: steps.test-claim.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = [
              '# Project Forge onboarding test acceptance invalid',
              '',
              'The self-test acceptance did not pass validation. No authorization state was changed.',
              '',
              'Add a new comment containing exactly `/accept-project-forge` while signed in as the same active admin who opened this test issue.',
              '',
              'If this test expired, create a fresh **Test Project Forge onboarding** issue instead.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.setFailed('Invalid Project Forge onboarding self-test acceptance.');

      - name: Resolve Project Forge Builder app identity for test
        id: test-app-identity
        if: steps.test-claim.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Verify GitHub App installation for test identity
        id: test-app-token
        if: steps.test-claim.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.test-claim.outputs.target_owner }}
          permission-contents: read

      - name: Verify public Project Forge contract for test
        id: test-contract
        if: steps.test-claim.outcome == 'success'
        continue-on-error: true
        run: |
          python tools/public_contract.py

      - name: Report onboarding test result
        if: steps.test-claim.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_OWNER: ${{ steps.test-claim.outputs.target_owner }}
          APP_OK: ${{ steps.test-app-token.outcome }}
          CONTRACT_OK: ${{ steps.test-contract.outcome }}
          APP_SLUG: ${{ steps.test-app-identity.outputs.app-slug }}
        with:
          script: |
            const target = process.env.TARGET_OWNER;
            const app = process.env.APP_OK === 'success';
            const contract = process.env.CONTRACT_OK === 'success';
            const ready = app && contract;
            const setup = 'https://github.com/mriekki/project-forge-platform/blob/main/chatgpt/SETUP.md';
            const appUrl = `https://github.com/apps/${process.env.APP_SLUG}/installations/new`;
            const body = [
              ready ? '# TEST READY FOR PROJECT FORGE ✓' : '# Project Forge onboarding test needs attention',
              '',
              '**TEST MODE — authorization state was not changed.**',
              '',
              `✓ GitHub self-test identity: @${target}`,
              `${app ? '✓' : '✗'} Project Forge Builder GitHub App installation: ${app ? 'VERIFIED' : 'NOT VERIFIED'}`,
              `${contract ? '✓' : '✗'} Public Project Forge contract: ${contract ? 'VERIFIED' : 'UNAVAILABLE OR INVALID'}`,
              '✓ Developer registry mutation: NOT PERFORMED',
              '✓ Compatibility allowlist mutation: NOT PERFORMED',
              '✓ Project generation: NOT PERFORMED',
              '',
              ready
                ? `The onboarding mechanics are ready to rehearse through the one-time ChatGPT setup: ${setup}`
                : `Resolve the failed check above${app ? '' : ` (App: ${appUrl})`}, then add a new comment containing exactly \`/accept-project-forge\`.`,
              '',
              'A real invitation still requires a separate `[invite-project-forge] <github-user>` issue and the real invited identity. This test grants no future authorization.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            if (ready) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
